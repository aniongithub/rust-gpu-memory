[workspace]
resolver = "2"
members = ["crates/gpu-memory", "crates/gpu-memory-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/aniongithub/rust-gpu-memory"

[workspace.dependencies]
gpu-memory = { path = "crates/gpu-memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
