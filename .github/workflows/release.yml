name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-pre)"
        required: true
        default: "v0.1.0-pre"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            asset: gpu-memory-x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            asset: gpu-memory-aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            asset: gpu-memory-x86_64-pc-windows-msvc
            ext: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: false
            asset: gpu-memory-aarch64-pc-windows-msvc
            ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            asset: gpu-memory-x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            asset: gpu-memory-aarch64-unknown-linux-gnu
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deps-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install zig + cargo-zigbuild (cross only)
        if: matrix.cross
        run: |
          set -e
          ZIG_VER=0.15.2
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz"
          tar -xf /tmp/zig.tar.xz -C /tmp
          ZIGDIR=$(ls -d /tmp/zig-x86_64-linux-${ZIG_VER})
          echo "$ZIGDIR" >> "$GITHUB_PATH"
          export PATH="$ZIGDIR:$PATH"
          zig version
          curl -fsSL -o /tmp/czb.tar.xz "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz"
          tar -xf /tmp/czb.tar.xz -C /tmp
          mkdir -p "$HOME/.cargo/bin"
          cp /tmp/cargo-zigbuild-x86_64-unknown-linux-gnu/cargo-zigbuild "$HOME/.cargo/bin/"
          chmod +x "$HOME/.cargo/bin/cargo-zigbuild"
          cargo-zigbuild --version

      - name: Build
        if: matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build (Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: cmd
        run: |
          for /f "tokens=* delims=" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set "VS_PATH=%%i"
          if not defined VS_PATH (
            echo ERROR: Visual Studio not found
            exit /b 1
          )
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64_arm64
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Package artifact
        shell: bash
        run: |
          set -e
          # The binary inside the archive must keep its platform extension:
          # `gpu-memory.exe` on Windows, `gpu-memory` elsewhere.
          BIN_NAME="gpu-memory"
          case "${{ matrix.target }}" in
            *-pc-windows-*) BIN_NAME="gpu-memory.exe" ;;
          esac
          BIN="target/${{ matrix.target }}/release/${BIN_NAME}"
          test -f "$BIN"
          rm -rf stage && mkdir -p stage
          cp "$BIN" "stage/${BIN_NAME}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            # `tar -a` cannot emit a real .zip (it only auto-compresses
            # .gz/.bz2/.xz/.lzma), so use PowerShell's Compress-Archive,
            # which is always present on the Windows runner.
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'stage/${BIN_NAME}' -DestinationPath '${{ matrix.asset }}.zip' -Force"
          else
            (cd stage && tar czf "../${{ matrix.asset }}.tar.gz" "${BIN_NAME}")
          fi
          ls -la "${{ matrix.asset }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.${{ matrix.ext }}
          if-no-files-found: error

  package-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Package crate
        run: cargo package -p gpu-memory --allow-dirty

      - uses: actions/upload-artifact@v4
        with:
          name: crate
          path: target/package/gpu-memory-*.crate
          if-no-files-found: error

  release:
    needs: [build, package-crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # A tag with a hyphen (e.g. v0.1.0-pre.1) is a pre-release; a plain
          # semver tag (e.g. v0.1.0) is a stable release.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          draft: false
          files: artifacts/*/*
          body: |
            Release of **gpu-memory** — platform-independent total/available GPU memory reporting with correct discrete vs unified (UMA) handling.

            ## Contents
            - `gpu-memory` crate (`.crate`) — the library
            - `gpu-memory` CLI binaries for each platform

            ## Platforms
            | Asset | Target |
            | --- | --- |
            | `gpu-memory-x86_64-apple-darwin.tar.gz` | macOS (Intel) |
            | `gpu-memory-aarch64-apple-darwin.tar.gz` | macOS (Apple Silicon) |
            | `gpu-memory-x86_64-pc-windows-msvc.zip` | Windows (x86_64) |
            | `gpu-memory-aarch64-pc-windows-msvc.zip` | Windows (ARM64, e.g. RTX Spark) |
            | `gpu-memory-x86_64-unknown-linux-gnu.tar.gz` | Linux (x86_64) |
            | `gpu-memory-aarch64-unknown-linux-gnu.tar.gz` | Linux (ARM64, e.g. DGX Spark) |

            ## Quick start
            ```sh
            tar xzf gpu-memory-<target>.tar.gz   # or unzip on Windows
            ./gpu-memory            # human-readable table
            ./gpu-memory --json     # machine-readable JSON
            ```
